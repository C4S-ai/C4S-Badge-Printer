<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>C4S Badge Printer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="Logo.png">
    
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #000000;
            --accent-color: #00e676;
            --accent-hover: #00c853;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-muted: #555555;
            --brand-red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        .brand-logo-only {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 5px auto;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .upload-zone {
            width: 100%;
            border: 2px dashed var(--border-muted);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background-color: var(--card-bg);
            transition: border-color 0.2s;
        }

        .upload-zone:hover {
            border-color: var(--accent-color);
        }

        .crop-viewport {
            width: 280px;
            height: 280px;
            border: 2px solid var(--border-muted);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            background-color: #050505;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .crop-viewport.active {
            border-color: var(--accent-color);
        }

        #image-to-crop {
            position: absolute;
            transform-origin: center center;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000000;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-download:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background-color: #333333;
            color: #888888;
        }

        .btn-download:not(:disabled):hover {
            background-color: var(--accent-hover);
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        footer span.brand-text {
            color: var(--brand-red);
            font-weight: 600;
        }

        .help-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 6px 12px;
            border: 1px solid #333;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .help-link:hover {
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <img class="brand-logo-only" src="Logo.png" alt="C4S Badge Printer">
    </header>

    <main class="container">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <p>📷 <strong>Tap to select a photo</strong></p>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Target: 57mm Badge (300 DPI)</p>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <p style="font-size: 0.75rem; color: var(--text-muted);">Drag photo to move • Pinch to zoom</p>

        <div class="crop-viewport" id="viewport">
            <img id="image-to-crop" style="display: none;">
        </div>

        <button class="btn-download" id="btn-download" disabled>
            Download Ready-to-Print Badge
        </button>
    </main>

    <footer>
        <p>© 2026 <span class="brand-text">C4S.ai</span>. All Rights Reserved.</p>
        <p style="font-size: 0.7rem;">Licensed for Amy's World</p>
        <a href="https://wa.me/96560908108" target="_blank" class="help-link">
            💬 HELP
        </a>
    </footer>

    <canvas id="export-canvas" width="673" height="673"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const img = document.getElementById('image-to-crop');
        const viewport = document.getElementById('viewport');
        const btnDownload = document.getElementById('btn-download');
        const canvas = document.getElementById('export-canvas');
        const ctx = canvas.getContext('2d');

        let scale = 1;
        let posX = 0;
        let posY = 0;
        let isDragging = false;
        let startX, startY;
        let initialDistance = 0;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.src = event.target.result;
                    img.style.display = 'block';
                    viewport.classList.add('active');
                    btnDownload.disabled = false;
                    
                    img.onload = () => {
                        const vpWidth = viewport.clientWidth;
                        const vpHeight = viewport.clientHeight;
                        const scaleW = vpWidth / img.naturalWidth;
                        const scaleH = vpHeight / img.naturalHeight;
                        scale = Math.max(scaleW, scaleH);
                        posX = (vpWidth - img.naturalWidth * scale) / 2;
                        posY = (vpHeight - img.naturalHeight * scale) / 2;
                        updateTransform();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function updateTransform() {
            img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        // Pointer Events for Mouse & Touch Pan/Zoom
        viewport.addEventListener('pointerdown', (e) => {
            if (!img.src) return;
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            viewport.setPointerCapture(e.pointerId);
        });

        viewport.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            updateTransform();
        });

        viewport.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { viewport.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        // Touch Pinch-to-Zoom
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance > 0) {
                const newDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = newDistance / initialDistance;
                scale *= zoomFactor;
                initialDistance = newDistance;
                updateTransform();
            }
        });

        // Mouse Wheel Zoom
        viewport.addEventListener('wheel', (e) => {
            if (!img.src) return;
            e.preventDefault();
            const zoomSpeed = 0.05;
            if (e.deltaY < 0) {
                scale *= (1 + zoomSpeed);
            } else {
                scale *= (1 - zoomSpeed);
            }
            updateTransform();
        }, { passive: false });

        // Generate 300 DPI 57mm Image Output (673x673 px)
        btnDownload.addEventListener('click', () => {
            if (!img.src) return;
            
            const targetSize = 673; // 57mm at 300 DPI
            const vpSize = viewport.clientWidth;
            const ratio = targetSize / vpSize;

            ctx.clearRect(0, 0, targetSize, targetSize);
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, targetSize, targetSize);

            const drawX = posX * ratio;
            const drawY = posY * ratio;
            const drawW = img.naturalWidth * scale * ratio;
            const drawH = img.naturalHeight * scale * ratio;

            ctx.drawImage(img, drawX, drawY, drawW, drawH);

            const link = document.createElement('a');
            link.download = `C4S-Badge-57mm-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });
    </script>
</body>
</html>
