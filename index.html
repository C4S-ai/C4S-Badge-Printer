<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>C4S Badge Printer</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: #fdf9ed !important;
            color: #1a1a1a !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
        }

        .brand-logo-only {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 12px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .upload-zone {
            width: 100%;
            border: 2px dashed #94a3b8;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            background-color: #f8fafc !important;
            color: #1a1a1a !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .upload-zone:hover {
            border-color: #00c853;
            background-color: #f1f5f9 !important;
        }

        .crop-viewport {
            width: 280px;
            height: 280px;
            border: 2px solid #94a3b8;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            background-color: #ffffff !important;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .crop-viewport.active {
            border-color: #00c853;
        }

        #image-to-crop {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Circular Crop Guide Overlay */
        .circle-guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 0 200px rgba(255, 255, 255, 0.92);
            border: 2px dashed #00c853;
            pointer-events: none;
            z-index: 10;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            background-color: #00c853 !important;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-download:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #cbd5e1 !important;
            color: #64748b !important;
            box-shadow: none;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        footer span.brand-text {
            color: #ef4444 !important;
            font-weight: 600;
        }

        .help-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b !important;
            text-decoration: none;
            font-size: 0.8rem;
            padding: 6px 14px;
            border: 1px solid #94a3b8;
            border-radius: 20px;
            background-color: #f8fafc !important;
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <img class="brand-logo-only" src="Logo.png" alt="C4S Badge Printer">
    </header>

    <main class="container">
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
            <p>📷 <strong>Tap to select a photo</strong></p>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">Target: 57mm Round Badge (300 DPI)</p>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <p style="font-size: 0.75rem; color: #64748b;">Drag photo to move • Pinch to zoom</p>

        <div class="crop-viewport" id="viewport">
            <img id="image-to-crop" style="display: none;">
            <div class="circle-guide"></div>
        </div>

        <button class="btn-download" id="btn-download" disabled>
            Download Ready-to-Print Badge
        </button>
    </main>

    <footer>
        <p>© 2026 <span class="brand-text">C4S.ai</span>. All Rights Reserved.</p>
        <p style="font-size: 0.7rem;">Licensed for Amy's World</p>
        <a href="https://wa.me/96560908108" target="_blank" class="help-link">
            💬 HELP
        </a>
    </footer>

    <canvas id="export-canvas" width="673" height="673"></canvas>

    <script>
        const fileInput = document.getElementById('file-input');
        const img = document.getElementById('image-to-crop');
        const viewport = document.getElementById('viewport');
        const btnDownload = document.getElementById('btn-download');
        const canvas = document.getElementById('export-canvas');
        const ctx = canvas.getContext('2d');

        let scale = 1;
        let defaultFitScale = 1;
        let posX = 0;
        let posY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        let initialPinchDist = null;
        let startScale = 1;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.src = event.target.result;
                    img.style.display = 'block';
                    viewport.classList.add('active');
                    btnDownload.disabled = false;
                    
                    img.onload = () => {
                        const vpWidth = viewport.clientWidth;
                        const vpHeight = viewport.clientHeight;
                        const scaleW = vpWidth / img.naturalWidth;
                        const scaleH = vpHeight / img.naturalHeight;
                        
                        defaultFitScale = Math.min(scaleW, scaleH);
                        scale = defaultFitScale;
                        
                        posX = (vpWidth - img.naturalWidth * scale) / 2;
                        posY = (vpHeight - img.naturalHeight * scale) / 2;
                        updateTransform();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function updateTransform() {
            const vpWidth = viewport.clientWidth;
            const vpHeight = viewport.clientHeight;

            if (scale < defaultFitScale) {
                scale = defaultFitScale;
            }
            
            const displayW = img.naturalWidth * scale;
            const displayH = img.naturalHeight * scale;

            if (displayW <= vpWidth) {
                posX = (vpWidth - displayW) / 2;
            } else {
                posX = Math.max(vpWidth - displayW, Math.min(0, posX));
            }

            if (displayH <= vpHeight) {
                posY = (vpHeight - displayH) / 2;
            } else {
                posY = Math.max(vpHeight - displayH, Math.min(0, posY));
            }

            img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        // --- Touch Gestures ---
        viewport.addEventListener('touchstart', (e) => {
            if (!img.src) return;
            if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                startScale = scale;
            } else if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - posX;
                startY = e.touches[0].clientY - posY;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (!img.src) return;
            if (e.touches.length === 2 && initialPinchDist) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let newScale = startScale * (currentDist / initialPinchDist);
                if (newScale < defaultFitScale) newScale = defaultFitScale;
                scale = newScale;
                updateTransform();
            } else if (e.touches.length === 1 && isDragging) {
                posX = e.touches[0].clientX - startX;
                posY = e.touches[0].clientY - startY;
                updateTransform();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDist = null;
            if (e.touches.length === 0) isDragging = false;
        });

        // --- Mouse Panning ---
        viewport.addEventListener('pointerdown', (e) => {
            if (!img.src || e.pointerType === 'touch') return;
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            try { viewport.setPointerCapture(e.pointerId); } catch(err) {}
        });

        viewport.addEventListener('pointermove', (e) => {
            if (!isDragging || e.pointerType === 'touch') return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            updateTransform();
        });

        viewport.addEventListener('pointerup', (e) => {
            if (e.pointerType === 'touch') return;
            isDragging = false;
            try { viewport.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        // --- Mouse Wheel Zoom ---
        viewport.addEventListener('wheel', (e) => {
            if (!img.src) return;
            e.preventDefault();
            const zoomSpeed = 0.1;
            if (e.deltaY < 0) {
                scale *= (1 + zoomSpeed);
            } else {
                scale *= (1 - zoomSpeed);
            }
            if (scale < defaultFitScale) scale = defaultFitScale;
            updateTransform();
        }, { passive: false });

        // --- Generate Output ---
        btnDownload.addEventListener('click', () => {
            if (!img.src) return;
            
            const targetSize = 673;
            const vpWidth = viewport.clientWidth;
            const ratio = targetSize / vpWidth;
            const center = targetSize / 2;
            const radius = targetSize / 2;

            ctx.save();
            ctx.clearRect(0, 0, targetSize, targetSize);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, targetSize, targetSize);

            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            const drawX = posX * ratio;
            const drawY = posY * ratio;
            const drawW = img.naturalWidth * scale * ratio;
            const drawH = img.naturalHeight * scale * ratio;

            ctx.drawImage(img, drawX, drawY, drawW, drawH);
            ctx.restore();

            ctx.beginPath();
            ctx.arc(center, center, radius - 1, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.stroke();

            const link = document.createElement('a');
            link.download = `C4S-Round-Badge-57mm-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });
    </script>
</body>
</html>
